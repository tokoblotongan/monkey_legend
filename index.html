<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Monkey Legend — Sun Wukong Adventure</title>

<!-- CSS Utama -->
<link rel="stylesheet" href="css/style.css">
<!-- CSS Sprite Lompat (PISAH — mudah di-maintain) -->
<link rel="stylesheet" href="css/jump-sprite.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<base target="_blank">
</head>
<body>

<canvas id="c"></canvas>
<div class="qf" id="qf"></div>

<!-- Container untuk efek visual lompat (dust, trail, ring) -->
<div id="jumpEffects" style="position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden"></div>

<!-- Sprite Sheet (hidden, class dari jump-sprite.css) -->
<img id="lompatSprite" class="sprite-sheet" src="https://raw.githubusercontent.com/tokoblotongan/monkey_legend/main/assets/images/lompat.png" crossorigin="anonymous" alt="">

<!-- UI Game -->
<div id="ui">
  <div class="panel"><h3>Nyawa</h3><div class="bar-w"><div class="bar-f hp-f" id="hpB" style="width:100%"></div></div></div>
  <div class="panel" style="text-align:center"><h3>Skor</h3><div class="val g" id="scV">0</div></div>
  <div class="panel" style="text-align:center"><h3>Jarak</h3><div class="val c" id="dsV">0m</div></div>
  <div class="panel"><h3>Energi</h3><div class="bar-w"><div class="bar-f en-f" id="enB" style="width:100%"></div></div></div>
</div>

<!-- Touch Controls -->
<div id="touchControls">
  <div id="joystickZone"><div id="joystickBase"></div><div id="joystickThumb"></div></div>
  <div id="actionButtons">
    <div class="act-row"><div class="act-btn" id="btnCloud">Awan</div><div class="act-btn" id="btnJump">Lompat</div></div>
    <div class="act-row"><div class="act-btn" id="btnKame">Kame</div><div class="act-btn" id="btnAtk">Tongkat</div></div>
    <div class="act-btn" id="btnDown">Turun</div>
  </div>
</div>

<!-- Overlay Menu -->
<div id="overlay">
  <div id="coverBg"></div>
  <div id="menuContent">
    <div class="enter-hint">⚡ Tekan ENTER / Klik Tombol ⚡</div>
    <button class="btn" id="startBtn">Mulai Petualangan</button>
    <div class="ctrls">
      <div class="ctrl"><kbd>←</kbd><kbd>→</kbd> Gerak</div>
      <div class="ctrl"><kbd>↑</kbd> Lompat</div>
      <div class="ctrl"><kbd>↓</kbd> Turun</div>
      <div class="ctrl"><kbd>A</kbd> Tongkat</div>
      <div class="ctrl"><kbd>S</kbd> Awan</div>
      <div class="ctrl"><kbd>D</kbd> Kamehameha</div>
    </div>
  </div>
</div>

<!-- Game Over -->
<div id="gameover">
  <h1>Tumbang!</h1>
  <div class="st" id="goSt"></div>
  <div class="enter-hint">⚡ Tekan ENTER / Klik Tombol ⚡</div>
  <button class="btn" id="restartBtn">Coba Lagi</button>
</div>

<!-- Loading -->
<div id="loadingBar"><div id="loadingFill"></div></div>
<div id="loadingText">Memuat karakter...</div>

<!-- ========== JAVASCRIPT ========== -->
<script src="js/utils.js"></script>
<script src="js/cloud.js"></script>
<script src="js/player.js"></script>
<script src="js/game.js"></script>

<!-- ========== SPRITE LOMPAT SYSTEM ========== -->
<script>
/*
 * SUN WUKONG JUMP SPRITE SYSTEM
 * Modular, terpisah dari game engine inti
 * File: css/jump-sprite.css  |  Config di bawah
 */
(function() {
  'use strict';

  const CONFIG = {
    scale: 1.6,            // Skala sprite (override via CSS var --jump-scale)
    animSpeed: 6,          // Tick per ganti frame
    yOffset: -5,           // Offset vertikal render
    effectsEnabled: true,  // Aktifkan dust, trail, ring, shake
    debug: false
  };

  const STATE = { IDLE: 0, TAKEOFF: 1, AIR: 2, LANDING: 3 };

  class JumpSpriteSystem {
    constructor() {
      this.canvas = document.getElementById('c');
      this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
      this.sprite = document.getElementById('lompatSprite');
      this.fxContainer = document.getElementById('jumpEffects');
      this.body = document.body;

      this.frameWidth = 0;
      this.frameHeight = 0;
      this.loaded = false;

      this.currentFrame = 0;
      this.animTimer = 0;
      this.jumpState = STATE.IDLE;
      this.prevVy = 0;
      this.isActive = false;
      this.landTimer = 0;

      this.player = null;
      this.playerFound = false;

      // Efek state
      this.lastTrailTime = 0;
      this.dustSpawned = false;

      this.init();
    }

    init() {
      if (!this.canvas || !this.ctx) {
        console.warn('[JumpSprite] Canvas tidak ditemukan');
        return;
      }

      if (this.sprite.complete && this.sprite.naturalWidth) {
        this.onSpriteLoad();
      } else {
        this.sprite.onload = () => this.onSpriteLoad();
        this.sprite.onerror = () => console.error('[JumpSprite] Gagal load sprite');
      }

      this.hookGameLoop();
      this.findPlayerLoop();
    }

    onSpriteLoad() {
      this.frameWidth = this.sprite.naturalWidth / 4;
      this.frameHeight = this.sprite.naturalHeight;
      this.loaded = true;
      if (CONFIG.debug) console.log('[JumpSprite] Loaded:', this.frameWidth + 'x' + this.frameHeight);
    }

    findPlayerLoop() {
      const tryFind = () => {
        if (this.playerFound) return;
        const candidates = ['player', 'hero', 'wukong', 'p', 'monkey', 'char'];
        for (let name of candidates) {
          if (window[name] && typeof window[name] === 'object' && window[name].x !== undefined) {
            this.player = window[name];
            this.playerFound = true;
            if (CONFIG.debug) console.log('[JumpSprite] Player found:', name);
            return;
          }
        }
        for (let key in window) {
          try {
            const obj = window[key];
            if (obj && typeof obj === 'object' && !Array.isArray(obj) &&
                obj.x !== undefined && obj.y !== undefined &&
                (obj.vy !== undefined || obj.velocityY !== undefined || obj.speedY !== undefined)) {
              this.player = obj;
              this.playerFound = true;
              if (CONFIG.debug) console.log('[JumpSprite] Auto-detected:', key);
              return;
            }
          } catch(e) {}
        }
      };
      tryFind();
      setTimeout(() => tryFind(), 500);
      setTimeout(() => tryFind(), 1500);
    }

    getPlayerState() {
      if (!this.player) return null;
      const p = this.player;
      return {
        x: p.x || p.posX || p.positionX || 0,
        y: p.y || p.posY || p.positionY || 0,
        w: p.width || p.w || p.size || 50,
        h: p.height || p.h || 70,
        vx: p.vx || p.velocityX || p.speedX || 0,
        vy: p.vy || p.velocityY || p.speedY || 0,
        onGround: p.onGround !== undefined ? p.onGround : p.grounded !== undefined ? p.grounded : false,
        facing: p.facing || p.direction || p.flip || (p.vx < 0 ? -1 : 1)
      };
    }

    // ========== EFEK VISUAL ==========
    spawnDust(x, y) {
      if (!CONFIG.effectsEnabled || !this.fxContainer) return;
      for (let i = 0; i < 5; i++) {
        const dust = document.createElement('div');
        dust.className = 'jump-dust';
        const angle = (Math.PI * 2 * i) / 5;
        const dist = 20 + Math.random() * 20;
        dust.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        dust.style.setProperty('--dy', Math.sin(angle) * dist * 0.5 + 'px');
        dust.style.left = (x + Math.random() * 20 - 10) + 'px';
        dust.style.top = (y + Math.random() * 10) + 'px';
        dust.style.width = (6 + Math.random() * 6) + 'px';
        dust.style.height = dust.style.width;
        this.fxContainer.appendChild(dust);
        requestAnimationFrame(() => dust.classList.add('animate'));
        setTimeout(() => dust.remove(), 450);
      }
    }

    spawnLandingRing(x, y) {
      if (!CONFIG.effectsEnabled || !this.fxContainer) return;
      const ring = document.createElement('div');
      ring.className = 'landing-ring';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      ring.style.width = '60px';
      ring.style.height = '20px';
      this.fxContainer.appendChild(ring);
      requestAnimationFrame(() => ring.classList.add('animate'));
      setTimeout(() => ring.remove(), 550);
    }

    spawnAirTrail(x, y, facing) {
      if (!CONFIG.effectsEnabled || !this.fxContainer) return;
      const now = performance.now();
      if (now - this.lastTrailTime < 80) return;
      this.lastTrailTime = now;
      const trail = document.createElement('div');
      trail.className = 'air-trail';
      trail.style.left = (x + (facing === -1 ? 30 : -10)) + 'px';
      trail.style.top = (y + 25) + 'px';
      trail.style.transform = facing === -1 ? 'scaleX(-1)' : 'scaleX(1)';
      this.fxContainer.appendChild(trail);
      requestAnimationFrame(() => trail.classList.add('show'));
      setTimeout(() => trail.remove(), 350);
    }

    screenShake() {
      if (!CONFIG.effectsEnabled) return;
      this.body.classList.remove('screen-shake');
      void this.body.offsetWidth; // reflow
      this.body.classList.add('screen-shake');
      setTimeout(() => this.body.classList.remove('screen-shake'), 260);
    }

    // ========== STATE & ANIMATION ==========
    updateJumpState(ps) {
      const vy = ps.vy;

      if (!ps.onGround && Math.abs(vy) > 0.3) {
        this.isActive = true;
        if (vy < -0.5) {
          if (this.jumpState !== STATE.TAKEOFF) {
            this.jumpState = STATE.TAKEOFF;
            this.dustSpawned = false;
          }
        } else if (vy > 0.5) {
          this.jumpState = STATE.LANDING;
        } else {
          this.jumpState = STATE.AIR;
        }
      } else if (ps.onGround && this.jumpState === STATE.LANDING) {
        this.landTimer++;
        if (this.landTimer > 8) {
          this.isActive = false;
          this.jumpState = STATE.IDLE;
          this.currentFrame = 0;
          this.landTimer = 0;
          this.dustSpawned = false;
        }
      } else if (ps.onGround) {
        this.isActive = false;
        this.jumpState = STATE.IDLE;
        this.currentFrame = 0;
        this.landTimer = 0;
        this.dustSpawned = false;
      }
      this.prevVy = vy;
    }

    updateAnimation() {
      if (!this.isActive) return;
      this.animTimer++;
      if (this.animTimer < CONFIG.animSpeed) return;
      this.animTimer = 0;

      switch (this.jumpState) {
        case STATE.TAKEOFF:
          if (this.currentFrame < 1) this.currentFrame++;
          else this.currentFrame = 1;
          break;
        case STATE.AIR:
          this.currentFrame = 2;
          break;
        case STATE.LANDING:
          if (this.currentFrame < 3) this.currentFrame++;
          else this.currentFrame = 3;
          break;
      }
    }

    draw() {
      if (!this.loaded || !this.isActive) return;
      const ps = this.getPlayerState();
      if (!ps) return;

      const renderW = this.frameWidth * CONFIG.scale;
      const renderH = this.frameHeight * CONFIG.scale;
      const renderX = ps.x + (ps.w - renderW) / 2;
      const renderY = ps.y + (ps.h - renderH) + CONFIG.yOffset;
      const centerX = ps.x + ps.w / 2;
      const bottomY = ps.y + ps.h;

      // Efek Takeoff — dust saat dorong
      if (this.jumpState === STATE.TAKEOFF && !this.dustSpawned) {
        this.spawnDust(centerX, bottomY);
        this.dustSpawned = true;
      }

      // Efek Air — trail
      if (this.jumpState === STATE.AIR) {
        this.spawnAirTrail(ps.x, ps.y, ps.facing);
      }

      // Efek Landing — ring & shake
      if (this.jumpState === STATE.LANDING && this.currentFrame === 3 && this.landTimer === 0) {
        this.spawnLandingRing(centerX, bottomY);
        if (Math.abs(this.prevVy) > 8) this.screenShake(); // shake hanya jika landing keras
      }

      // Render sprite
      this.ctx.save();
      if (ps.facing === -1 || ps.facing === 'left') {
        this.ctx.translate(renderX + renderW, renderY);
        this.ctx.scale(-1, 1);
        this.ctx.drawImage(
          this.sprite,
          this.currentFrame * this.frameWidth, 0,
          this.frameWidth, this.frameHeight,
          0, 0, renderW, renderH
        );
      } else {
        this.ctx.drawImage(
          this.sprite,
          this.currentFrame * this.frameWidth, 0,
          this.frameWidth, this.frameHeight,
          renderX, renderY, renderW, renderH
        );
      }

      // Bayangan saat di udara
      if (this.jumpState !== STATE.IDLE) {
        this.ctx.globalAlpha = 0.12;
        this.ctx.fillStyle = '#000';
        this.ctx.beginPath();
        this.ctx.ellipse(centerX, bottomY - 2, ps.w * 0.35, 5, 0, 0, Math.PI * 2);
        this.ctx.fill();
      }
      this.ctx.restore();
    }

    hookGameLoop() {
      const originalRAF = window.requestAnimationFrame;
      const self = this;
      window.requestAnimationFrame = function(callback) {
        return originalRAF.call(window, function(timestamp) {
          const ps = self.getPlayerState();
          if (ps) {
            self.updateJumpState(ps);
            self.updateAnimation();
          }
          callback(timestamp);
          self.draw();
        });
      };
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => new JumpSpriteSystem());
  } else {
    new JumpSpriteSystem();
  }
})();
</script>

</body>
</html>
