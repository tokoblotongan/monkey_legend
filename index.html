<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkey Legend - The Monkey King Adventure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #c {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* MENU */
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      text-align: center;
      color: white;
    }

    #menu img {
      max-width: 90%;
      max-height: 70vh;
      width: auto;
      height: auto;
      margin-bottom: 20px;
    }

    #startBtn {
      background: linear-gradient(to right, #FFA500, #FF69B4);
      border: none;
      color: white;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(255, 105, 180, 0.5);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 105, 180, 0.7);
    }

    .controls {
      margin-top: 20px;
      background: rgba(0,0,0,0.6);
      padding: 12px 20px;
      border-radius: 10px;
      display: inline-block;
      font-size: 14px;
    }

    /* GAME OVER */
    #gameover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      background: rgba(0,0,0,0.85);
      color: white;
    }

    #goSt {
      font-size: 24px;
      margin-bottom: 30px;
      text-align: center;
    }

    #goSt span {
      color: #FFD700;
      font-weight: bold;
    }

    #restartBtn {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 14px 32px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* UI IN-GAME */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 5;
      color: white;
      font-size: 16px;
    }

    .bar-container {
      width: 200px;
      margin: 5px 0;
    }

    .bar-label {
      margin-bottom: 4px;
      font-weight: bold;
    }

    .bar {
      height: 16px;
      background: #333;
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #4CAF50;
      transition: width 0.3s ease;
    }

    #hpBar .bar-fill { background: #F44336; }
    #enBar .bar-fill { background: #2196F3; }

    #score, #distance {
      margin: 8px 0;
      font-size: 18px;
      font-weight: bold;
    }

    /* Touch Controls (optional) */
    #touchControls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: none;
      justify-content: center;
      gap: 20px;
    }

    .btn-touch {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 2px solid #fff;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn-touch.pressed {
      background: rgba(255,255,255,0.5);
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <!-- CANVAS HARUS DI ATAS SEMUA -->
  <canvas id="c"></canvas>

  <!-- MENU -->
  <div id="menu">
    <img src="assets/images/menu-bg.png" alt="Monkey Legend">
    <button id="startBtn">Mulai Petualangan</button>
    <div class="controls">
      ⌨️ ENTER / Klik Tombol<br>
      ← → Gerak | ↑ Lompat | A Serang | S Awan | D Kamehameha
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover">
    <div id="goSt">
      Skor: <span id="goScore">0</span><br>
      Jarak: <span id="goDistance">0</span>m
    </div>
    <button id="restartBtn">Main Lagi</button>
  </div>

  <!-- IN-GAME UI -->
  <div id="ui">
    <div class="bar-container" id="hpBar">
      <div class="bar-label">HP</div>
      <div class="bar"><div class="bar-fill" id="hpB" style="width:100%"></div></div>
    </div>
    <div class="bar-container" id="enBar">
      <div class="bar-label">Energy</div>
      <div class="bar"><div class="bar-fill" id="enB" style="width:100%"></div></div>
    </div>
    <div id="score">Skor: <span id="scV">0</span></div>
    <div id="distance">Jarak: <span id="dsV">0</span>m</div>
  </div>

  <!-- TOUCH CONTROLS (opsional, untuk mobile) -->
  <div id="touchControls">
    <div class="btn-touch" id="btnJump">↑</div>
    <div class="btn-touch" id="btnAtk">A</div>
    <div class="btn-touch" id="btnKame">D</div>
    <div class="btn-touch" id="btnCloud">S</div>
  </div>

  <!-- SCRIPTS — HARUS DI BAWAH CANVAS -->
  <script src="kingkong.js"></script>
  <script src="game(3).js"></script>

</body>
</html>
